<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Máquina de las Transformaciones</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#dff7fb;font-family:Arial,sans-serif;color:#102957;
}
main{width:min(900px,94vw);text-align:center}
h1{
  margin:0 0 20px;font-size:clamp(26px,5vw,48px);
  background:#173b47;color:#fff;padding:18px 24px;border-radius:24px
}
.machine{
  background:#b8e7ef;border:8px solid #173b47;border-radius:30px;
  padding:30px;box-shadow:0 10px 0 #0d6873
}
.row{display:flex;justify-content:center;align-items:center;gap:8px;margin:20px 0;flex-wrap:wrap}
.box{
  width:clamp(58px,10vw,90px);height:clamp(58px,10vw,90px);
  background:#fffdf8;border:5px solid #168d96;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(30px,6vw,48px);font-weight:bold
}
.op{font-size:clamp(38px,6vw,55px);font-weight:bold;color:#f58b22}
button{
  border:0;border-radius:30px;padding:18px 35px;font-size:22px;
  font-weight:bold;cursor:pointer;background:#f3a13a;color:white;
  box-shadow:0 6px 0 #c96816
}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #c96816}
button:disabled{opacity:.65;cursor:wait}
#resultado{margin-top:20px;font-size:24px;font-weight:bold;min-height:35px}
</style>
</head>
<body>
<main>
<h1>🚀 MÁQUINA DE LAS TRANSFORMACIONES</h1>
<div class="machine">
  <div class="row">
    <div class="box" id="a">1</div>
    <div class="box" id="b">2</div>
    <div class="box" id="c">3</div>
    <div class="op" id="operacion">+</div>
    <div class="box" id="d">1</div>
    <div class="box" id="e">2</div>
    <div class="box" id="f">3</div>
  </div>
  <button id="girar" type="button">GIRAR LA MÁQUINA 🚀</button>
  <div id="resultado">TOCÁ EL BOTÓN PARA COMENZAR</div>
</div>
</main>

<script>
let cantidadDeGiros = 0;

function numeroDeTresCifras() {
  return Math.floor(Math.random() * 90) + 10;
}

function mostrarNumero(numero, prefijo) {
  const centenas = Math.floor(numero / 100);
  const resto = numero % 100;
  const decenas = Math.floor(resto / 10);
  const unidades = resto % 10;

  document.getElementById(prefijo + "a").textContent = centenas;
  document.getElementById(prefijo + "b").textContent = decenas;
  document.getElementById(prefijo + "c").textContent = unidades;
}

function girar() {
  cantidadDeGiros++;

  const primero = Math.floor(Math.random() * 70) + 10;
  const segundo = Math.floor(Math.random() * 30) + 10;
  const suma = primero + segundo;

  const cientos1 = Math.floor(primero / 100);
  const decenas1 = Math.floor((primero % 100) / 10);
  const unidades1 = primero % 10;

  const cientos2 = Math.floor(segundo / 100);
  const decenas2 = Math.floor((segundo % 100) / 10);
  const unidades2 = segundo % 10;

  document.getElementById("a").textContent = cientos1;
  document.getElementById("b").textContent = decenas1;
  document.getElementById("c").textContent = unidades1;
  document.getElementById("d").textContent = cientos2;
  document.getElementById("e").textContent = decenas2;
  document.getElementById("f").textContent = unidades2;

  document.getElementById("operacion").textContent = "+";
  document.getElementById("resultado").textContent =
    "¡GIRO " + cantidadDeGiros + "!  " + primero + " + " + segundo + " = " + suma;
}

document.getElementById("girar").addEventListener("click", girar);
</script>
</body>
</html>
